name: Feature request
description: Propose a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a household cannot do today, or what is harder than it should be.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Note any interaction with the deterministic finance engine or the AI layer.
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      options:
        - label: The proposal keeps every financial calculation out of the language model.
          required: true
