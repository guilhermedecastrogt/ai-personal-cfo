name: ai-personal-cfo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 768M
        reservations:
          memory: 256M

  migrate:
    image: ${API_IMAGE:?set API_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}
    command: ['node', 'dist/database/run-migrations.js']
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M

  api:
    <<: *hardening
    image: ${API_IMAGE:?set API_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TRUSTED_PROXY_HOPS: '1'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:?set OPENAI_MODEL}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.8}
      KAPSO_API_KEY: ${KAPSO_API_KEY:?set KAPSO_API_KEY}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET:?set KAPSO_WEBHOOK_SECRET}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:?set KAPSO_PHONE_NUMBER_ID}
      KAPSO_API_BASE_URL: ${KAPSO_API_BASE_URL:-https://api.kapso.ai/meta/whatsapp/v24.0}
      PROACTIVE_EVALUATION_ENABLED: ${PROACTIVE_EVALUATION_ENABLED:-false}
      PROACTIVE_AI_MESSAGES: ${PROACTIVE_AI_MESSAGES:-false}
    networks:
      - data
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M
        reservations:
          memory: 192M

  web:
    <<: *hardening
    image: ${WEB_IMAGE:?set WEB_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
        reservations:
          memory: 128M

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      CFO_DOMAIN: ${CFO_DOMAIN:?set CFO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--output-document=/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          memory: 32M

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
